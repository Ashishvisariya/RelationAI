services:
  # ──────────────────────────────────────────────
  # Backend — FastAPI (Docker)
  # ──────────────────────────────────────────────
  - type: web
    name: relationai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # change to 'free' to use Render's free tier (cold starts apply)
    region: oregon
    envVars:
      - key: PORT
        value: 8000
    healthCheckPath: /
    # The .pth model file is excluded from Git (see .gitignore).
    # Upload it via Render's Disk or build it in your CI pipeline.
    # To mount a persistent disk uncomment the block below:
    # disk:
    #   name: model-weights
    #   mountPath: /app/model
    #   sizeGB: 1

  # ──────────────────────────────────────────────
  # Frontend — Static Site
  # ──────────────────────────────────────────────
  - type: web
    name: relationai-frontend
    runtime: static
    staticPublishPath: ./Frontend
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
